apiVersion: apps/v1
kind: Deployment
metadata:
  name: kolo-ledger
  namespace: default
  labels:
    app.kubernetes.io/name: kolo-ledger
    app.kubernetes.io/part-of: kolo-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kolo-ledger
  template:
    metadata:
      labels:
        app: kolo-ledger
    spec:
      containers:
        - name: ledger
          image: kolo-ledger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://kolo:kolo_secure_pass@kolo-postgres:5432/kolo_db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
