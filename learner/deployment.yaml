apiVersion: apps/v1
kind: Deployment
metadata:
  name: kolo-ledger
  namespace: default
  labels:
    app.kubernetes.io/name: kolo-ledger
    app.kubernetes.io/part-of: kolo-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kolo-ledger
  template:
    metadata:
      labels:
        app: kolo-ledger
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ledger
          image: kolo-ledger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "draining in-flight requests"
                    sleep 10
          env:
            - name: DATABASE_URL
              value: "postgresql://kolo:kolo_secure_pass@kolo-postgres:5432/kolo_db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            